services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: careerconnect
      MYSQL_USER: career
      MYSQL_PASSWORD: career_local_only
      MYSQL_ROOT_PASSWORD: career_root_local_only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - career_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "127.0.0.1:6335:6333"
    volumes:
      - career_qdrant:/qdrant/storage
volumes:
  career_mysql:
  career_qdrant:
